name: Desktop builds
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run smoke:electron
      - run: npx electron-builder --${{ matrix.target }} --arm64 --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: node scripts/smoke-electron.mjs --packaged
      - uses: actions/upload-artifact@v4
        with:
          name: RustyPDF-${{ matrix.os }}
          path: release/
