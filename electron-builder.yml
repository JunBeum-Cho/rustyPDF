appId: com.rustpdf.viewer
productName: RustyPDF
asar: true
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!node_modules/pdfjs-dist/**/*"
  - "!node_modules/@tesseract.js-data/**/*"
  - "!node_modules/tesseract.js-core/**/*"
extraResources:
  - from: resources/assets
    to: assets
asarUnpack:
  - node_modules/tesseract.js/**/*
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Signing uses CSC_LINK/CSC_KEY_PASSWORD when present; set CSC_IDENTITY_AUTO_DISCOVERY=false to skip.
  # Notarization is enabled only by env (APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID, or APPLE_API_KEY*).
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
fileAssociations:
  - ext: pdf
    name: PDF Document
    role: Viewer
directories:
  output: release
# Auto update feed is off by default. Example generic provider:
# publish:
#   provider: generic
#   url: https://updates.example.com/rustypdf
publish: null
