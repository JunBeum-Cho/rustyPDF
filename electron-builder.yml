appId: com.rustpdf.viewer
productName: RustyPDF
asar: true
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!node_modules/pdfjs-dist/**/*"
  - "!node_modules/@tesseract.js-data/**/*"
  - "!node_modules/tesseract.js-core/**/*"
extraResources:
  - from: resources/assets
    to: assets
asarUnpack:
  - node_modules/tesseract.js/**/*
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.productivity
  identity: null
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
fileAssociations:
  - ext: pdf
    name: PDF Document
    role: Viewer
directories:
  output: release
